parameters:
  - name: serviceUrl
    type: string
  - name: healthEndpoint
    type: string
    default: '/health'
  - name: maxRetries
    type: number
    default: 5
  - name: retryDelay
    type: number
    default: 10

steps:
  - script: |
      echo "Testing connectivity to: ${{ parameters.serviceUrl }}${{ parameters.healthEndpoint }}"

      SUCCESS=false
      for i in $(seq 1 ${{ parameters.maxRetries }}); do
        echo "Attempt $i of ${{ parameters.maxRetries }}"

        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ parameters.serviceUrl }}${{ parameters.healthEndpoint }} || echo "000")

        if [ "$RESPONSE" = "200" ]; then
          echo "✓ Service is healthy! (HTTP $RESPONSE)"
          SUCCESS=true
          break
        else
          echo "✗ Service not ready (HTTP $RESPONSE). Waiting ${{ parameters.retryDelay }} seconds..."
          sleep ${{ parameters.retryDelay }}
        fi
      done

      if [ "$SUCCESS" = false ]; then
        echo "ERROR: Service failed to respond after ${{ parameters.maxRetries }} attempts"
        exit 1
      fi

      # Additional connectivity test to root endpoint
      echo "Testing root endpoint..."
      curl -v ${{ parameters.serviceUrl }}/

    displayName: 'Test Service Connectivity'
