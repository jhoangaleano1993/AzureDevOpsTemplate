parameters:
  - name: kubernetesServiceConnection
    type: string
  - name: namespace
    type: string
  - name: serviceName
    type: string
    default: "app-hola-mundo-service"
  - name: servicePort
    type: number
    default: 80
  - name: healthEndpoint
    type: string
    default: "/health"
  - name: maxRetries
    type: number
    default: 5
  - name: retryDelay
    type: number
    default: 10

steps:
  - task: Kubernetes@1
    displayName: "Test Service Connectivity"
    inputs:
      connectionType: "Kubernetes Service Connection"
      kubernetesServiceEndpoint: "${{ parameters.kubernetesServiceConnection }}"
      namespace: "${{ parameters.namespace }}"
      command: "run"
      arguments: "test-connectivity --rm -i --restart=Never --image=curlimages/curl -- curl -sf --connect-timeout 10 --retry ${{ parameters.maxRetries }} --retry-delay ${{ parameters.retryDelay }} --retry-all-errors http://${{ parameters.serviceName }}.${{ parameters.namespace }}.svc.cluster.local:${{ parameters.servicePort }}${{ parameters.healthEndpoint }}"
