# Template para ejecutar terraform apply
parameters:
  - name: workingDirectory
    type: string
  - name: planFile
    type: string
    default: 'tfplan'
  - name: awsAccessKeyId
    type: string
  - name: awsSecretAccessKey
    type: string
  - name: awsRegion
    type: string

steps:
  - task: Bash@3
    displayName: 'Terraform Apply'
    inputs:
      targetType: 'inline'
      workingDirectory: '${{ parameters.workingDirectory }}'
      script: |
        echo "=== Iniciando Terraform Apply ==="
        terraform apply -auto-approve -no-color ${{ parameters.planFile }}
        echo "=== Terraform Apply Completado ==="
    env:
      AWS_ACCESS_KEY_ID: ${{ parameters.awsAccessKeyId }}
      AWS_SECRET_ACCESS_KEY: ${{ parameters.awsSecretAccessKey }}
      AWS_DEFAULT_REGION: ${{ parameters.awsRegion }}
      TF_IN_AUTOMATION: "true"
      TF_LOG: ""
