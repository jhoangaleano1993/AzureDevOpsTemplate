# Template para instalar Terraform y herramientas de AWS
parameters:
  - name: terraformVersion
    type: string
    default: '1.13.0'
  - name: installAwsCli
    type: boolean
    default: false
  - name: installKubectl
    type: boolean
    default: false

steps:
  - task: Bash@3
    displayName: 'Install Terraform'
    inputs:
      targetType: 'inline'
      script: |
        # Verificar si Terraform ya está instalado
        if command -v terraform &> /dev/null; then
          echo "Terraform ya está instalado: $(terraform version)"
        else
          # Instalar Terraform
          wget -q https://releases.hashicorp.com/terraform/${{ parameters.terraformVersion }}/terraform_${{ parameters.terraformVersion }}_linux_amd64.zip
          unzip -q terraform_${{ parameters.terraformVersion }}_linux_amd64.zip
          sudo mv terraform /usr/local/bin/
          terraform version
        fi

  - ${{ if eq(parameters.installAwsCli, true) }}:
    - task: Bash@3
      displayName: 'Install AWS CLI v2'
      inputs:
        targetType: 'inline'
        script: |
          # Verificar si AWS CLI ya está instalado
          if command -v aws &> /dev/null; then
            echo "AWS CLI ya está instalado: $(aws --version)"
          else
            # Instalar AWS CLI v2
            curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install
            aws --version
          fi

  - ${{ if eq(parameters.installKubectl, true) }}:
    - task: Bash@3
      displayName: 'Install kubectl'
      inputs:
        targetType: 'inline'
        script: |
          # Verificar si kubectl ya está instalado
          if command -v kubectl &> /dev/null; then
            echo "kubectl ya está instalado: $(kubectl version --client --short 2>/dev/null || kubectl version --client)"
          else
            # Instalar kubectl
            curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
            kubectl version --client
          fi
