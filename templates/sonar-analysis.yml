parameters:
  - name: sonarProjectKey
    type: string
  - name: sonarOrganization
    type: string

steps:
  # Configurar Java en el PATH para SonarCloud
  - bash: |
      echo "##vso[task.setvariable variable=JAVA_HOME]/usr/lib/jvm/java-17-openjdk-amd64"
      echo "##vso[task.setvariable variable=PATH]/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH"
      java -version
    displayName: 'Setup Java for SonarCloud'

  - task: SonarCloudPrepare@4
    displayName: 'Prepare SonarCloud Analysis'
    inputs:
      SonarCloud: 'SonarCloud-Connection'
      organization: '${{ parameters.sonarOrganization }}'
      scannerMode: 'CLI'
      configMode: 'manual'
      cliProjectKey: '${{ parameters.sonarProjectKey }}'
      cliProjectName: '${{ parameters.sonarProjectKey }}'
      cliSources: 'src'
      extraProperties: |
        sonar.javascript.lcov.reportPaths=coverage/lcov.info
        sonar.coverage.exclusions=**/*.test.js,**/__tests__/**

  - task: SonarCloudAnalyze@4
    displayName: 'Run SonarCloud Analysis'
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PATH: /usr/lib/jvm/java-17-openjdk-amd64/bin:$(PATH)

  - task: SonarCloudPublish@4
    displayName: 'Publish SonarCloud Results'
    inputs:
      pollingTimeoutSec: '300'
