parameters:
  - name: sonarProjectKey
    type: string
  - name: sonarOrganization
    type: string

steps:
  - task: SonarQubePrepare@5
    displayName: 'Prepare SonarQube Cloud Analysis'
    inputs:
      SonarQube: 'SonarCloud-Connection'
      scannerMode: 'CLI'
      configMode: 'manual'
      cliProjectKey: '${{ parameters.sonarProjectKey }}'
      cliProjectName: '${{ parameters.sonarProjectKey }}'
      cliSources: 'src'
      extraProperties: |
        sonar.organization=${{ parameters.sonarOrganization }}
        sonar.javascript.lcov.reportPaths=coverage/lcov.info
        sonar.coverage.exclusions=**/*.test.js,**/__tests__/**

  - task: SonarQubeAnalyze@5
    displayName: 'Run SonarQube Cloud Analysis'

  - task: SonarQubePublish@5
    displayName: 'Publish SonarQube Results'
    inputs:
      pollingTimeoutSec: '300'