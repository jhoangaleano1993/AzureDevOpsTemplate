parameters:
  - name: kubernetesServiceConnection
    type: string
  - name: namespace
    type: string
  - name: manifests
    type: object
  - name: imageName
    type: string

steps:
  - bash: |
      set -e

      TARGET_IMAGE="${{ parameters.imageName }}"
      WORKSPACE="$(Pipeline.Workspace)"

      echo "Replacing image placeholder in deployment manifests..."
      echo "Target image: ${TARGET_IMAGE}"
      echo "Workspace: ${WORKSPACE}"

      # Create temp directory for modified manifests
      mkdir -p "${WORKSPACE}/k8s-modified"

      # Process deployment.yaml
      echo "Processing deployment.yaml..."
      sed "s|image: app-hola-mundo:latest|image: ${TARGET_IMAGE}|g" \
        "${WORKSPACE}/k8s/deployment.yaml" > "${WORKSPACE}/k8s-modified/deployment.yaml"

      # Copy service.yaml (no changes needed)
      echo "Copying service.yaml..."
      cp "${WORKSPACE}/k8s/service.yaml" "${WORKSPACE}/k8s-modified/service.yaml"

      echo ""
      echo "Modified deployment.yaml - Image line:"
      grep -A 2 "image:" "${WORKSPACE}/k8s-modified/deployment.yaml" || true

      echo ""
      echo "Files created:"
      ls -la "${WORKSPACE}/k8s-modified/"
    displayName: 'Prepare Kubernetes Manifests'

  - task: KubernetesManifest@0
    displayName: 'Deploy to Kubernetes'
    inputs:
      action: 'deploy'
      kubernetesServiceConnection: '${{ parameters.kubernetesServiceConnection }}'
      namespace: '${{ parameters.namespace }}'
      manifests: |
        $(Pipeline.Workspace)/k8s-modified/deployment.yaml
        $(Pipeline.Workspace)/k8s-modified/service.yaml

  - task: Kubernetes@1
    displayName: 'Verify Deployment'
    inputs:
      connectionType: 'Kubernetes Service Connection'
      kubernetesServiceEndpoint: '${{ parameters.kubernetesServiceConnection }}'
      namespace: '${{ parameters.namespace }}'
      command: 'get'
      arguments: 'pods -l app=app-hola-mundo'

  - task: Kubernetes@1
    displayName: 'Get Service Info'
    inputs:
      connectionType: 'Kubernetes Service Connection'
      kubernetesServiceEndpoint: '${{ parameters.kubernetesServiceConnection }}'
      namespace: '${{ parameters.namespace }}'
      command: 'get'
      arguments: 'service app-hola-mundo-service'
